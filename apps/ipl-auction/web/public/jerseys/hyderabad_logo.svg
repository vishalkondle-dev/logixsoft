<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="20%" stop-color="#FCE070" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#997316" />
      <stop offset="100%" stop-color="#FFEA8A" />
    </linearGradient>

    <!-- Fiery Orange Field -->
    <linearGradient id="orangeField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A" />
      <stop offset="35%" stop-color="#F25000" />
      <stop offset="75%" stop-color="#992E00" />
      <stop offset="100%" stop-color="#2B0C00" />
    </linearGradient>

    <!-- Solar Phoenix Flame Gradient -->
    <linearGradient id="phoenixGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF3300" />
      <stop offset="40%" stop-color="#FFAA00" />
      <stop offset="80%" stop-color="#FFEE55" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FF5500" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1F0800" stop-opacity="0" />
    </radialGradient>

    <filter id="dropHeavy" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- 1 CHAMPIONSHIP STAR (2016 IPL Champions) -->
    <g filter="url(#dropSmall)">
      <path d="M300,32 L306,49 L325,49 L310,60 L316,77 L300,66 L284,77 L290,60 L275,49 L294,49 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="1.4" />
    </g>

    <!-- SHIELD -->
    <g filter="url(#dropHeavy)">
      <path d="M300,92 L468,122 C486,230 476,366 300,488 C124,366 114,230 132,122 Z"
            fill="url(#goldGrad)" stroke="#4F3100" stroke-width="2" />
      <path d="M300,101 L458,129 C474,232 465,358 300,474 C135,358 126,232 142,129 Z"
            fill="#120500" stroke="#FFE885" stroke-width="1" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#orangeField)" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#sunGlow)" />
      <path d="M300,122 L434,146 C446,236 438,338 300,442 C162,338 154,236 166,146 Z"
            fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.6" stroke-dasharray="14 6" />
    </g>

    <!-- CENTERPIECE: RISING SOLAR PHOENIX / EAGLE (Original Modern Artwork) -->
    <g transform="translate(300, 255)" filter="url(#dropSmall)">
      <!-- Radiant Sunrise Disc Behind Phoenix -->
      <circle cx="0" cy="15" r="52" fill="#FFB300" opacity="0.35" />
      <circle cx="0" cy="15" r="42" fill="#FF6A00" opacity="0.35" />

      <!-- Left Phoenix Wing (Sweeping Fiery Feather Blades) -->
      <path d="M-15,35 C-45,20 -75,-15 -90,-60 C-65,-30 -40,-15 -25,5 Z" fill="url(#phoenixGrad)" />
      <path d="M-20,45 C-55,30 -90,0 -105,-40 C-85,-15 -55,0 -35,18 Z" fill="url(#phoenixGrad)" />
      <path d="M-20,55 C-50,50 -80,30 -95,-10 C-75,10 -50,25 -30,35 Z" fill="url(#phoenixGrad)" />

      <!-- Right Phoenix Wing (Symmetric Sweeping Blades) -->
      <path d="M15,35 C45,20 75,-15 90,-60 C65,-30 40,-15 25,5 Z" fill="url(#phoenixGrad)" />
      <path d="M20,45 C55,30 90,0 105,-40 C85,-15 55,0 35,18 Z" fill="url(#phoenixGrad)" />
      <path d="M20,55 C50,50 80,30 95,-10 C75,10 50,25 30,35 Z" fill="url(#phoenixGrad)" />

      <!-- Phoenix Center Chest & Tail -->
      <path d="M0,-35 L14,-10 L8,55 L0,78 L-8,55 L-14,-10 Z" fill="url(#goldGrad)" stroke="#572000" stroke-width="1.2" />

      <!-- Phoenix Fierce Head & Beak Profile -->
      <path d="M0,-35 L8,-55 L18,-48 L28,-42 L12,-38 L5,-32 Z" fill="#FFFBE6" />
      <polygon points="18,-48 34,-45 22,-40" fill="url(#goldGrad)" stroke="#401200" stroke-width="0.8" />
      <!-- Sharp Eye -->
      <circle cx="10" cy="-45" r="2.5" fill="#000000" />
      <circle cx="10" cy="-45" r="1" fill="#FFEA00" />
    </g>

    <!-- BANNER: "HYDERABAD" -->
    <g transform="translate(0, 38)">
      <path d="M75,360 L140,348 L140,406 L75,418 L92,389 Z" fill="#3D1000" />
      <path d="M78,364 L137,353 L137,403 L78,414 L94,389 Z" fill="url(#goldGrad)" />
      <path d="M140,348 L160,348 L140,370 Z" fill="#0A0300" />

      <path d="M525,360 L460,348 L460,406 L525,418 L508,389 Z" fill="#3D1000" />
      <path d="M522,364 L463,353 L463,403 L522,414 L506,389 Z" fill="url(#goldGrad)" />
      <path d="M460,348 L440,348 L460,370 Z" fill="#0A0300" />

      <path d="M115,345 L485,345 L502,410 L98,410 Z" fill="#120500" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropHeavy)" />
      <path d="M122,351 L478,351 L493,404 L107,404 Z" fill="#2E0C00" stroke="#FFEAA0" stroke-width="1" />

      <line x1="127" y1="356" x2="473" y2="356" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />
      <line x1="113" y1="399" x2="487" y2="399" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />

      <!-- "HYDERABAD" TEXT -->
      <text x="300" y="392"
            font-family="'Montserrat', 'Trebuchet MS', 'Arial Black', sans-serif"
            font-size="32"
            font-weight="900"
            font-style="italic"
            letter-spacing="5"
            text-anchor="middle"
            fill="url(#goldGrad)"
            stroke="#0A0300"
            stroke-width="2"
            filter="url(#dropSmall)">HYDERABAD</text>
    </g>
  </g>
</svg>