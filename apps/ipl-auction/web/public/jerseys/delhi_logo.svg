<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="20%" stop-color="#FCE070" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#997316" />
      <stop offset="100%" stop-color="#FFEA8A" />
    </linearGradient>

    <!-- Royal Blue Field -->
    <linearGradient id="blueField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0072CE" />
      <stop offset="40%" stop-color="#004B99" />
      <stop offset="80%" stop-color="#002866" />
      <stop offset="100%" stop-color="#001133" />
    </linearGradient>

    <linearGradient id="tigerRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2B38" />
      <stop offset="50%" stop-color="#D71920" />
      <stop offset="100%" stop-color="#7A0007" />
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#00A6FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#004B99" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#001133" stop-opacity="0" />
    </radialGradient>

    <filter id="dropHeavy" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- SHIELD -->
    <g filter="url(#dropHeavy)">
      <path d="M300,92 L468,122 C486,230 476,366 300,488 C124,366 114,230 132,122 Z"
            fill="url(#goldGrad)" stroke="#4F3100" stroke-width="2" />
      <path d="M300,101 L458,129 C474,232 465,358 300,474 C135,358 126,232 142,129 Z"
            fill="#001133" stroke="#FFE885" stroke-width="1" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#blueField)" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#blueGlow)" />
      <path d="M300,122 L434,146 C446,236 438,338 300,442 C162,338 154,236 166,146 Z"
            fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.6" stroke-dasharray="14 6" />
    </g>

    <!-- CENTERPIECE: FIERCE ROARING RED & GOLD TIGER HEAD (Original Artwork) -->
    <g transform="translate(300, 255)" filter="url(#dropSmall)">
      <!-- Tiger Crown / Ear Tufts -->
      <polygon points="-35,-65 -20,-95 -10,-60" fill="url(#tigerRed)" stroke="url(#goldGrad)" stroke-width="1.2" />
      <polygon points="10,-60 20,-95 35,-65" fill="url(#tigerRed)" stroke="url(#goldGrad)" stroke-width="1.2" />

      <!-- Tiger Forehead / Brow -->
      <path d="M-45,-60 C-20,-75 20,-75 45,-60 C55,-40 50,-10 35,15 C0,45 -35,15 -50,-10 C-55,-40 -45,-60 -45,-60 Z" fill="url(#tigerRed)" stroke="url(#goldGrad)" stroke-width="2" />

      <!-- Tiger Golden Stripes on Forehead -->
      <polygon points="0,-65 6,-45 0,-40 -6,-45" fill="url(#goldGrad)" />
      <polygon points="-25,-50 -12,-42 -22,-36" fill="url(#goldGrad)" />
      <polygon points="25,-50 12,-42 22,-36" fill="url(#goldGrad)" />
      <polygon points="-35,-32 -20,-26 -30,-20" fill="url(#goldGrad)" />
      <polygon points="35,-32 20,-26 30,-20" fill="url(#goldGrad)" />

      <!-- Fierce Tiger Eyes -->
      <polygon points="-30,-25 -15,-20 -20,-12 -32,-18" fill="#000B1A" />
      <polygon points="-28,-23 -17,-19 -22,-14 -30,-17" fill="#FFFFFF" />
      <circle cx="-23" cy="-18" r="2.5" fill="#FFCC00" />

      <polygon points="30,-25 15,-20 20,-12 32,-18" fill="#000B1A" />
      <polygon points="28,-23 17,-19 22,-14 30,-17" fill="#FFFFFF" />
      <circle cx="23" cy="-18" r="2.5" fill="#FFCC00" />

      <!-- Snout, Nose & Whisker Pads -->
      <polygon points="0,-12 10,-2 -10,-2" fill="#000B1A" />
      <path d="M-28,5 C-15,-2 0,-5 15,-2 C28,5 25,22 15,22 C0,18 -15,18 -28,5 Z" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1" />
      <circle cx="-15" cy="8" r="1.5" fill="#000B1A" />
      <circle cx="-8" cy="12" r="1.5" fill="#000B1A" />
      <circle cx="15" cy="8" r="1.5" fill="#000B1A" />
      <circle cx="8" cy="12" r="1.5" fill="#000B1A" />

      <!-- Roaring Jaws & Sharp White Fangs -->
      <path d="M-20,18 L20,18 L15,48 L-15,48 Z" fill="#000B1A" />
      <!-- Upper Fangs -->
      <polygon points="-18,18 -14,35 -10,18" fill="#FFFFFF" />
      <polygon points="18,18 14,35 10,18" fill="#FFFFFF" />
      <polygon points="-8,18 -5,28 -2,18" fill="#FFFFFF" />
      <polygon points="8,18 5,28 2,18" fill="#FFFFFF" />
      <!-- Lower Fangs -->
      <polygon points="-14,48 -10,32 -6,48" fill="#FFFFFF" />
      <polygon points="14,48 10,32 6,48" fill="#FFFFFF" />
      <!-- Lower Chin -->
      <path d="M-18,48 L18,48 L10,65 L-10,65 Z" fill="url(#tigerRed)" stroke="url(#goldGrad)" stroke-width="1.5" />

      <!-- Triple Claw Slash Marks in Background -->
      <path d="M-65,-15 L-48,45" stroke="#FF2B38" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
      <path d="M-75,-5 L-58,55" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <path d="M65,-15 L48,45" stroke="#FF2B38" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
      <path d="M75,-5 L58,55" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- BANNER: "DELHI" -->
    <g transform="translate(0, 38)">
      <path d="M95,360 L155,348 L155,406 L95,418 L112,389 Z" fill="#4A0005" />
      <path d="M98,364 L152,353 L152,403 L98,414 L114,389 Z" fill="url(#goldGrad)" />
      <path d="M155,348 L175,348 L155,370 Z" fill="#000B1A" />

      <path d="M505,360 L445,348 L445,406 L505,418 L488,389 Z" fill="#4A0005" />
      <path d="M502,364 L448,353 L448,403 L502,414 L486,389 Z" fill="url(#goldGrad)" />
      <path d="M445,348 L425,348 L445,370 Z" fill="#000B1A" />

      <path d="M138,345 L462,345 L478,410 L122,410 Z" fill="#000E26" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropHeavy)" />
      <path d="M145,351 L455,351 L469,404 L131,404 Z" fill="#7A0007" stroke="#FFEAA0" stroke-width="1" />

      <line x1="150" y1="356" x2="450" y2="356" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />
      <line x1="138" y1="399" x2="462" y2="399" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />

      <!-- "DELHI" TEXT -->
      <text x="300" y="392"
            font-family="'Montserrat', 'Trebuchet MS', 'Arial Black', sans-serif"
            font-size="36"
            font-weight="900"
            font-style="italic"
            letter-spacing="6"
            text-anchor="middle"
            fill="url(#goldGrad)"
            stroke="#000A1A"
            stroke-width="2.2"
            filter="url(#dropSmall)">DELHI</text>
    </g>
  </g>
</svg>