name = "logix-relay"
main = "src/index.ts"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "relay.logixsoft.in", custom_domain = true }
]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "21d770a176254310990534eb1f814faf"

[[kv_namespaces]]
binding = "CACHE"
id = "0608234ee338413fa88f2e3feb0de283"

[vars]
NODE_ENV = "production"
API_URL = "https://relay.logixsoft.in"
DINE_API_URL = "https://dine-api.logixsoft.in"
DINE_FRONTEND_URL = "https://dine.logixsoft.in"
WA_API_URL = "https://wa.logixsoft.in"
DEFAULT_OUTLET_ID = "outlet_default"

[durable_objects]
bindings = [
  { name = "RELAY_BRIDGE", class_name = "RelayBridgeDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayBridgeDO"]
