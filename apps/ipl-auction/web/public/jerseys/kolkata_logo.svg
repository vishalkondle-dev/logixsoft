<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="20%" stop-color="#FCE070" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#997316" />
      <stop offset="100%" stop-color="#FFEA8A" />
    </linearGradient>

    <!-- Regal Purple Field -->
    <linearGradient id="purpleField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D2E96" />
      <stop offset="40%" stop-color="#3C1B68" />
      <stop offset="80%" stop-color="#220C40" />
      <stop offset="100%" stop-color="#110424" />
    </linearGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#8A45DC" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#3C1B68" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#110424" stop-opacity="0" />
    </radialGradient>

    <filter id="dropHeavy" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- 3 CHAMPIONSHIP STARS (3 Titles: 2012, 2014, 2024) -->
    <g filter="url(#dropSmall)">
      <path d="M235,54 L239,66 L251.5,66 L241.5,73.5 L245,85.5 L235,78 L225,85.5 L228.5,73.5 L218.5,66 L231,66 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="1" transform="rotate(-8, 235, 70)" />
      <!-- Grand Center Star -->
      <path d="M300,36 L305,51 L321,51 L308,61 L313,76 L300,66.5 L287,76 L292,61 L279,51 L295,51 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="1.4" />
      <path d="M365,54 L369,66 L381.5,66 L371.5,73.5 L375,85.5 L365,78 L355,85.5 L358.5,73.5 L348.5,66 L361,66 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="1" transform="rotate(8, 365, 70)" />
    </g>

    <!-- SHIELD -->
    <g filter="url(#dropHeavy)">
      <path d="M300,92 L468,122 C486,230 476,366 300,488 C124,366 114,230 132,122 Z"
            fill="url(#goldGrad)" stroke="#4F3100" stroke-width="2" />
      <path d="M300,101 L458,129 C474,232 465,358 300,474 C135,358 126,232 142,129 Z"
            fill="#110424" stroke="#FFE885" stroke-width="1" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#purpleField)" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#purpleGlow)" />
      <path d="M300,122 L434,146 C446,236 438,338 300,442 C162,338 154,236 166,146 Z"
            fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.6" stroke-dasharray="14 6" />
    </g>

    <!-- CENTERPIECE: STYLIZED GOLDEN KNIGHT HELMET & PLUME (Original Heraldry) -->
    <g transform="translate(300, 255)" filter="url(#dropSmall)">
      <!-- Sweeping Golden Plume -->
      <path d="M-20,-85 C10,-115 65,-105 85,-65 C65,-60 45,-60 30,-50 C55,-40 68,-15 55,5 C42,-10 25,-15 10,-10 C-10,-5 -25,-25 -20,-85 Z" fill="url(#goldGrad)" stroke="#4A2E00" stroke-width="1.2" />
      <path d="M0,-80 C20,-95 50,-90 62,-60 C48,-55 35,-55 25,-45 Z" fill="#FFFFFF" opacity="0.65" />

      <!-- Helmet Crest Mount -->
      <rect x="-16" y="-50" width="32" height="12" rx="4" fill="#1B0633" stroke="url(#goldGrad)" stroke-width="1.5" />

      <!-- Main Helmet Dome -->
      <path d="M-45,-38 C-45,-60 45,-60 45,-38 C55,-10 50,30 25,55 C0,75 -25,55 -45,30 C-52,10 -50,-20 -45,-38 Z" fill="#220C40" stroke="url(#goldGrad)" stroke-width="2.5" />
      <path d="M-38,-35 C-38,-52 38,-52 38,-35 C45,-10 42,25 20,46 C0,62 -20,46 -38,25 C-42,10 -40,-15 -38,-35 Z" fill="url(#goldGrad)" opacity="0.85" />

      <!-- Helmet Visor Face Plate -->
      <path d="M-30,-15 L30,-15 L38,15 L0,42 L-38,15 Z" fill="#110424" stroke="url(#goldGrad)" stroke-width="1.5" />

      <!-- Visor Slits (T-Shaped Knight Sight Slits) -->
      <polygon points="-25,-4 25,-4 25,2 -25,2" fill="#FFEA85" />
      <polygon points="-3,-2 3,-2 3,25 -3,25" fill="#FFEA85" />

      <!-- Breathing Holes (Gleaming Gold Rivets) -->
      <circle cx="-18" cy="15" r="2.5" fill="url(#goldGrad)" />
      <circle cx="-10" cy="22" r="2.5" fill="url(#goldGrad)" />
      <circle cx="18" cy="15" r="2.5" fill="url(#goldGrad)" />
      <circle cx="10" cy="22" r="2.5" fill="url(#goldGrad)" />

      <!-- Crossed Golden Swords beneath helmet -->
      <path d="M-75,45 L75,-35" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <path d="M-75,-35 L75,45" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Sword Guards -->
      <line x1="-68" y1="32" x2="-58" y2="52" stroke="url(#goldGrad)" stroke-width="3" />
      <line x1="-68" y1="-22" x2="-58" y2="-42" stroke="url(#goldGrad)" stroke-width="3" />
    </g>

    <!-- BANNER: "KOLKATA" -->
    <g transform="translate(0, 38)">
      <path d="M85,360 L145,348 L145,406 L85,418 L102,389 Z" fill="#2B0B47" />
      <path d="M88,364 L142,353 L142,403 L88,414 L104,389 Z" fill="url(#goldGrad)" />
      <path d="M145,348 L165,348 L145,370 Z" fill="#0D021A" />

      <path d="M515,360 L455,348 L455,406 L515,418 L498,389 Z" fill="#2B0B47" />
      <path d="M512,364 L458,353 L458,403 L512,414 L496,389 Z" fill="url(#goldGrad)" />
      <path d="M455,348 L435,348 L455,370 Z" fill="#0D021A" />

      <path d="M130,345 L470,345 L488,410 L112,410 Z" fill="#110424" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropHeavy)" />
      <path d="M137,351 L463,351 L479,404 L121,404 Z" fill="#280E47" stroke="#FFEAA0" stroke-width="1" />

      <line x1="142" y1="356" x2="458" y2="356" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />
      <line x1="128" y1="399" x2="472" y2="399" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />

      <!-- "KOLKATA" TEXT -->
      <text x="300" y="392"
            font-family="'Montserrat', 'Trebuchet MS', 'Arial Black', sans-serif"
            font-size="35"
            font-weight="900"
            font-style="italic"
            letter-spacing="5"
            text-anchor="middle"
            fill="url(#goldGrad)"
            stroke="#0D021A"
            stroke-width="2"
            filter="url(#dropSmall)">KOLKATA</text>
    </g>
  </g>
</svg>