<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Soft Ambient & Directional Shadow for 3D realism -->
    <filter id="jersey-shadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#010a17" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#010a17" flood-opacity="0.4" />
    </filter>

    <!-- Specular Highlight for athletic polyester sheen -->
    <linearGradient id="jersey-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Mumbai Indians Electric / Royal Blue Gradient -->
    <linearGradient id="mi-blue-torso" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="25%" stop-color="#0052cc" />
      <stop offset="65%" stop-color="#003580" />
      <stop offset="100%" stop-color="#001d4a" />
    </linearGradient>

    <!-- Left Sleeve (Lit) -->
    <linearGradient id="sleeve-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd" />
      <stop offset="100%" stop-color="#003580" />
    </linearGradient>

    <!-- Right Sleeve (Soft Shade) -->
    <linearGradient id="sleeve-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a58ca" />
      <stop offset="100%" stop-color="#00224f" />
    </linearGradient>

    <!-- Metallic Championship Gold Gradient -->
    <linearGradient id="mi-gold" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#fff2a8" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="55%" stop-color="#f5d76e" />
      <stop offset="80%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#e6c04f" />
    </linearGradient>

    <!-- Inner Collar Navy Insert -->
    <linearGradient id="collar-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#001833" />
      <stop offset="100%" stop-color="#000e1f" />
    </linearGradient>

    <!-- Subtle Jacquard Jersey Pattern -->
    <pattern id="jersey-pattern" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.04" />
      <line x1="6" y1="0" x2="6" y2="12" stroke="#000000" stroke-width="0.7" stroke-opacity="0.10" />
    </pattern>
  </defs>

  <g filter="url(#jersey-shadow)">
    <!-- 1. LEFT SLEEVE (Viewer's Left) -->
    <path
      d="M 70,54 L 20,85 C 17,87 16,91 18,94 L 32,120 C 33,122 36,123 39,122 L 69,102 Z"
      fill="url(#sleeve-left)"
    />
    <!-- Left Sleeve Gold Ribbed Cuff -->
    <path
      d="M 20,85 L 32,120 C 33,122 36,123 39,122 L 41,117 L 27,88 C 25,84 22,84 20,85 Z"
      fill="url(#mi-gold)"
    />

    <!-- 2. RIGHT SLEEVE (Viewer's Right) -->
    <path
      d="M 170,54 L 220,85 C 223,87 224,91 222,94 L 208,120 C 207,122 204,123 201,122 L 171,102 Z"
      fill="url(#sleeve-right)"
    />
    <!-- Right Sleeve Gold Ribbed Cuff -->
    <path
      d="M 220,85 L 208,120 C 207,122 204,123 201,122 L 199,117 L 213,88 C 215,84 218,84 220,85 Z"
      fill="url(#mi-gold)"
    />

    <!-- 3. MAIN TORSO -->
    <path
      d="M 70,54
         L 96,48
         Q 120,53 144,48
         L 170,54
         L 172,102
         L 163,196
         Q 120,202 77,196
         L 68,102
         Z"
      fill="url(#mi-blue-torso)"
    />

    <!-- Torso Texture Overlay -->
    <path
      d="M 70,54
         L 96,48
         Q 120,53 144,48
         L 170,54
         L 172,102
         L 163,196
         Q 120,202 77,196
         L 68,102
         Z"
      fill="url(#jersey-pattern)"
    />

    <!-- 4. SIDE FLANK GOLD RAZOR PANELS (Iconic MI Flank Styling) -->
    <!-- Left Flank Gold Slash -->
    <path
      d="M 69,82 L 81,105 L 76,196 L 68,194 L 68,102 Z"
      fill="url(#mi-gold)"
    />
    <path
      d="M 81,114 L 86,128 L 79,196 L 76,196 Z"
      fill="#ffffff"
      opacity="0.6"
    />

    <!-- Right Flank Gold Slash -->
    <path
      d="M 171,82 L 159,105 L 164,196 L 172,194 L 172,102 Z"
      fill="url(#mi-gold)"
    />
    <path
      d="M 159,114 L 154,128 L 161,196 L 164,196 Z"
      fill="#ffffff"
      opacity="0.6"
    />

    <!-- 5. SHOULDER ACCENT STRIPES -->
    <!-- Left Shoulder Gold & White -->
    <polygon points="73,55 94,51 90,56 70,60" fill="url(#mi-gold)" />
    <polygon points="71,62 88,58 85,62 69,66" fill="#ffffff" opacity="0.85" />

    <!-- Right Shoulder Gold & White -->
    <polygon points="167,55 146,51 150,56 170,60" fill="url(#mi-gold)" />
    <polygon points="169,62 152,58 155,62 171,66" fill="#ffffff" opacity="0.85" />

    <!-- 6. 5 CHAMPIONSHIP STARS (Celebrating 5 IPL Trophies) -->
    <g transform="translate(120, 78) scale(0.68)" fill="url(#mi-gold)" stroke="#aa7c11" stroke-width="0.3">
      <polygon points="0,-6 1.8,-1.8 6.3,-1.8 2.7,0.9 4,5.4 0,2.7 -4,5.4 -2.7,0.9 -6.3,-1.8 -1.8,-1.8" transform="translate(-24, 0)" />
      <polygon points="0,-6 1.8,-1.8 6.3,-1.8 2.7,0.9 4,5.4 0,2.7 -4,5.4 -2.7,0.9 -6.3,-1.8 -1.8,-1.8" transform="translate(-12, -2)" />
      <polygon points="0,-7 2.1,-2.1 7.3,-2.1 3.1,1.1 4.7,6.3 0,3.1 -4.7,6.3 -3.1,1.1 -7.3,-2.1 -2.1,-2.1" transform="translate(0, -3.5)" />
      <polygon points="0,-6 1.8,-1.8 6.3,-1.8 2.7,0.9 4,5.4 0,2.7 -4,5.4 -2.7,0.9 -6.3,-1.8 -1.8,-1.8" transform="translate(12, -2)" />
      <polygon points="0,-6 1.8,-1.8 6.3,-1.8 2.7,0.9 4,5.4 0,2.7 -4,5.4 -2.7,0.9 -6.3,-1.8 -1.8,-1.8" transform="translate(24, 0)" />
    </g>

    <!-- 7. CHEST CREST & SPONSOR LOGO -->
    <g transform="translate(120, 116)">
      <!-- Subtle Golden Aura -->
      <circle cx="0" cy="0" r="24" fill="#ffd700" opacity="0.08" filter="blur(4px)" />

      <!-- Iconic MI Geometric Lightning Chevron / Monogram -->
      <path d="M -16,-14 L -6,-14 L 3,3 L -3,3 Z" fill="url(#mi-gold)" />
      <path d="M -4,-14 L 6,-14 L 15,3 L 9,3 Z" fill="#ffffff" />
      <path d="M 6,-14 L 16,-14 L 7,14 L -1,14 Z" fill="url(#mi-gold)" />

      <!-- "MUMBAI" Banner Plaque -->
      <rect x="-38" y="18" width="76" height="15" rx="3" fill="#001a3d" stroke="url(#mi-gold)" stroke-width="1.2" />
      <text
        x="0"
        y="29.5"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Impact', 'Montserrat', sans-serif"
        font-weight="900"
        font-size="9.5"
        letter-spacing="2"
        fill="url(#mi-gold)"
      >MUMBAI</text>

      <!-- "INDIANS" Subtitle -->
      <text
        x="0"
        y="40"
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="800"
        font-size="5.8"
        letter-spacing="2.2"
        fill="#ffffff"
        opacity="0.9"
      >INDIANS</text>
    </g>

    <!-- 8. BOTTOM HEM GOLD TRIM -->
    <path
      d="M 77,192 Q 120,198 163,192 L 163,196 Q 120,202 77,196 Z"
      fill="url(#mi-gold)"
    />
    <path
      d="M 79,189 Q 120,194 161,189 L 162,191 Q 120,196 78,191 Z"
      fill="#ffffff"
      opacity="0.8"
    />

    <!-- 9. V-NECK COLLAR (Seamlessly fitted to neck & shoulders) -->
    <!-- Inner Neck Opening -->
    <path
      d="M 96,48 Q 120,44 144,48 Q 120,68 96,48 Z"
      fill="url(#collar-inner)"
    />
    <!-- Inner Tag Label -->
    <rect x="114" y="47" width="12" height="5" rx="1" fill="#003580" stroke="url(#mi-gold)" stroke-width="0.5" />
    <text x="120" y="50.8" text-anchor="middle" font-size="3.2" font-weight="bold" fill="url(#mi-gold)">MI</text>

    <!-- Ribbed V-Neck Border in Metallic Gold -->
    <path
      d="M 94,48 L 120,74 L 146,48"
      fill="none"
      stroke="url(#mi-gold)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Center V-Collar Insert Highlight -->
    <line x1="120" y1="62" x2="120" y2="74" stroke="#ffffff" stroke-width="1.2" opacity="0.95" />

    <!-- 10. REALISTIC SHEEN OVERLAY -->
    <path
      d="M 70,54
         L 96,48
         Q 120,53 144,48
         L 170,54
         L 172,102
         L 163,196
         Q 120,202 77,196
         L 68,102
         Z"
      fill="url(#jersey-sheen)"
      pointer-events="none"
    />
  </g>
</svg>
