<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="20%" stop-color="#FCE070" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#997316" />
      <stop offset="100%" stop-color="#FFEA8A" />
    </linearGradient>

    <!-- Royal Pink Field -->
    <linearGradient id="pinkField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F21D8C" />
      <stop offset="40%" stop-color="#C70E6F" />
      <stop offset="80%" stop-color="#7A0241" />
      <stop offset="100%" stop-color="#2B0016" />
    </linearGradient>

    <radialGradient id="pinkGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF59B2" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#C70E6F" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1F000E" stop-opacity="0" />
    </radialGradient>

    <filter id="dropHeavy" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- 1 CHAMPIONSHIP STAR (Inaugural 2008 IPL Champions) -->
    <g filter="url(#dropSmall)">
      <path d="M300,32 L306,49 L325,49 L310,60 L316,77 L300,66 L284,77 L290,60 L275,49 L294,49 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="1.4" />
    </g>

    <!-- SHIELD -->
    <g filter="url(#dropHeavy)">
      <path d="M300,92 L468,122 C486,230 476,366 300,488 C124,366 114,230 132,122 Z"
            fill="url(#goldGrad)" stroke="#4F3100" stroke-width="2" />
      <path d="M300,101 L458,129 C474,232 465,358 300,474 C135,358 126,232 142,129 Z"
            fill="#14000B" stroke="#FFE885" stroke-width="1" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#pinkField)" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#pinkGlow)" />
      <path d="M300,122 L434,146 C446,236 438,338 300,442 C162,338 154,236 166,146 Z"
            fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.6" stroke-dasharray="14 6" />
    </g>

    <!-- CENTERPIECE: TRIUMPHANT ROYAL WAR ELEPHANT (Jaipur Royal Heritage - Original Artwork) -->
    <g transform="translate(300, 255)" filter="url(#dropSmall)">
      <!-- Royal Crown on Elephant Head -->
      <path d="M-12,-72 L-18,-90 L-4,-82 L0,-95 L4,-82 L18,-90 L12,-72 Z" fill="url(#goldGrad)" stroke="#4A2E00" stroke-width="1" />

      <!-- Elephant Head Dome & Forehead -->
      <path d="M-38,-45 C-38,-72 38,-72 38,-45 C45,-20 35,10 20,30 C0,45 -20,45 -35,30 C-45,10 -42,-20 -38,-45 Z" fill="#1A0210" stroke="url(#goldGrad)" stroke-width="2" />
      <path d="M-30,-42 C-30,-62 30,-62 30,-42 C36,-20 28,6 15,22 C0,34 -15,34 -28,22 C-36,6 -34,-20 -30,-42 Z" fill="url(#goldGrad)" />

      <!-- Royal Golden Howdah / Head Armor Plate -->
      <polygon points="0,-52 20,-38 0,-24 -20,-38" fill="#E6007A" stroke="url(#goldGrad)" stroke-width="1.5" />
      <circle cx="0" cy="-38" r="4" fill="url(#goldGrad)" />

      <!-- Fierce Royal Eye -->
      <circle cx="-18" cy="-25" r="2.5" fill="#000B1A" />
      <circle cx="-18" cy="-25" r="1" fill="#FFFFFF" />
      <circle cx="18" cy="-25" r="2.5" fill="#000B1A" />
      <circle cx="18" cy="-25" r="1" fill="#FFFFFF" />

      <!-- Triumphant Raised Trunk (S-Curve pointing upwards in victory) -->
      <path d="M-10,15 C-10,35 -6,55 0,72 C6,55 10,35 10,15 Z" fill="url(#goldGrad)" stroke="#4A2E00" stroke-width="1.2" />
      <path d="M-6,70 C-15,85 -5,102 12,98 C25,95 24,78 10,80 C2,82 -2,72 0,70 Z" fill="url(#goldGrad)" stroke="#4A2E00" stroke-width="1.2" />

      <!-- Sweeping Royal Golden Tusks -->
      <!-- Left Tusk -->
      <path d="M-24,20 C-48,22 -65,10 -72,-12 C-68,2 -55,14 -28,30 Z" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1.2" />
      <!-- Right Tusk -->
      <path d="M24,20 C48,22 65,10 72,-12 C68,2 55,14 28,30 Z" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1.2" />

      <!-- Flank Royal Gold Ears -->
      <path d="M-38,-42 C-68,-40 -82,-15 -68,15 C-55,25 -42,10 -38,-5 Z" fill="url(#goldGrad)" stroke="#4A2E00" stroke-width="1" opacity="0.9" />
      <path d="M38,-42 C68,-40 82,-15 68,15 C55,25 42,10 38,-5 Z" fill="url(#goldGrad)" stroke="#4A2E00" stroke-width="1" opacity="0.9" />
    </g>

    <!-- BANNER: "RAJASTHAN" -->
    <g transform="translate(0, 38)">
      <path d="M75,360 L140,348 L140,406 L75,418 L92,389 Z" fill="#3D001F" />
      <path d="M78,364 L137,353 L137,403 L78,414 L94,389 Z" fill="url(#goldGrad)" />
      <path d="M140,348 L160,348 L140,370 Z" fill="#0A0005" />

      <path d="M525,360 L460,348 L460,406 L525,418 L508,389 Z" fill="#3D001F" />
      <path d="M522,364 L463,353 L463,403 L522,414 L506,389 Z" fill="url(#goldGrad)" />
      <path d="M460,348 L440,348 L460,370 Z" fill="#0A0005" />

      <path d="M115,345 L485,345 L502,410 L98,410 Z" fill="#12000A" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropHeavy)" />
      <path d="M122,351 L478,351 L493,404 L107,404 Z" fill="#2B0017" stroke="#FFEAA0" stroke-width="1" />

      <line x1="127" y1="356" x2="473" y2="356" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />
      <line x1="113" y1="399" x2="487" y2="399" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />

      <!-- "RAJASTHAN" TEXT -->
      <text x="300" y="392"
            font-family="'Montserrat', 'Trebuchet MS', 'Arial Black', sans-serif"
            font-size="31"
            font-weight="900"
            font-style="italic"
            letter-spacing="5"
            text-anchor="middle"
            fill="url(#goldGrad)"
            stroke="#0A0005"
            stroke-width="2"
            filter="url(#dropSmall)">RAJASTHAN</text>
    </g>
  </g>
</svg>