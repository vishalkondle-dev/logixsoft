name = "ipl-auction-web"
main = ".open-next/worker.js"
compatibility_date = "2026-08-13"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_API_URL = "https://ipl-auction-api.vishalkondle-dev.workers.dev"
NEXT_PUBLIC_WS_URL = "wss://ipl-auction-api.vishalkondle-dev.workers.dev"

routes = [
  { pattern = "auction.logixsoft.in/*", zone_name = "logixsoft.in" }
]
workers_dev = true
