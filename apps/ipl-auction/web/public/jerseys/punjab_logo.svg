<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="20%" stop-color="#FCE070" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#997316" />
      <stop offset="100%" stop-color="#FFEA8A" />
    </linearGradient>

    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5B842" />
      <stop offset="50%" stop-color="#946E13" />
      <stop offset="100%" stop-color="#594005" />
    </linearGradient>

    <!-- Crimson Red Field -->
    <linearGradient id="crimsonField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ED1B24" />
      <stop offset="40%" stop-color="#C4121B" />
      <stop offset="75%" stop-color="#850A10" />
      <stop offset="100%" stop-color="#420004" />
    </linearGradient>

    <radialGradient id="redGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FF4D55" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#C4121B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#300003" stop-opacity="0" />
    </radialGradient>

    <filter id="dropHeavy" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- SHIELD BASE -->
    <g filter="url(#dropHeavy)">
      <path d="M300,90 L468,124 C486,232 476,368 300,490 C124,368 114,232 132,124 Z"
            fill="url(#goldGrad)" stroke="#4F3100" stroke-width="2" />
      <path d="M300,99 L458,131 C474,234 465,360 300,476 C135,360 126,234 142,131 Z"
            fill="#1A0002" stroke="#FFE885" stroke-width="1" />
      <path d="M300,106 L450,137 C465,236 456,354 300,466 C144,354 135,236 150,137 Z"
            fill="url(#crimsonField)" />
      <path d="M300,106 L450,137 C465,236 456,354 300,466 C144,354 135,236 150,137 Z"
            fill="url(#redGlow)" />
      <path d="M300,120 L434,148 C446,238 438,340 300,444 C162,340 154,238 166,148 Z"
            fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.6" stroke-dasharray="14 6" />
    </g>

    <!-- TRIPLE GOLD STARS AT CREST TOP -->
    <g transform="translate(300, 68)" filter="url(#dropSmall)">
      <!-- Center Main Star -->
      <path d="M0,-14 L4,-4 L15,-4 L7,3 L10,13 L0,7 L-10,13 L-7,3 L-15,-4 L-4,-4 Z" fill="url(#goldGrad)" stroke="#4F3100" stroke-width="0.8" />
      <!-- Left Star -->
      <path d="M-42,-2 L-39,6 L-30,6 L-37,12 L-34,20 L-42,15 L-50,20 L-47,12 L-54,6 L-45,6 Z" fill="url(#goldGrad)" stroke="#4F3100" stroke-width="0.8" />
      <!-- Right Star -->
      <path d="M42,-2 L45,6 L54,6 L47,12 L50,20 L42,15 L34,20 L37,12 L30,6 L39,6 Z" fill="url(#goldGrad)" stroke="#4F3100" stroke-width="0.8" />
    </g>

    <!-- CENTERPIECE: FIERCE ROARING GOLDEN LION PROFILE -->
    <g transform="translate(290, 248)" filter="url(#dropSmall)">
      <!-- Mane Sweeping Wings / Ribbons (Dynamic Gold Flow) -->
      <!-- Mane Layer 1 (Back Dark Gold) -->
      <path d="M-105,-40 C-70,-80 -10,-75 25,-55 C5,-30 -30,-20 -50,-10 C-75,5 -95,20 -115,55 C-125,20 -120,-10 -105,-40 Z"
            fill="url(#darkGold)" />
      <path d="M-115,20 C-80,0 -30,0 5,10 C-15,30 -50,45 -70,60 C-95,80 -110,110 -120,135 C-130,95 -130,55 -115,20 Z"
            fill="url(#darkGold)" />

      <!-- Mane Layer 2 (Mid Metallic Gold Ribbons) -->
      <path d="M-85,-35 C-50,-70 5,-65 40,-45 C20,-22 -15,-12 -35,-2 C-60,12 -80,30 -95,65 C-105,30 -100,0 -85,-35 Z"
            fill="url(#goldGrad)" stroke="#5C3D00" stroke-width="1.2" />

      <path d="M-95,25 C-60,5 -10,8 20,20 C0,38 -30,52 -50,68 C-75,88 -90,115 -98,140 C-110,105 -110,65 -95,25 Z"
            fill="url(#goldGrad)" stroke="#5C3D00" stroke-width="1.2" />

      <path d="M-75,70 C-45,55 -5,55 25,65 C5,80 -20,95 -38,110 C-55,125 -68,145 -75,165 C-85,135 -85,100 -75,70 Z"
            fill="url(#goldGrad)" stroke="#5C3D00" stroke-width="1.2" />

      <!-- Lion Head / Brow / Forehead -->
      <path d="M-30,-50 C0,-65 45,-60 70,-40 C85,-25 90,-5 82,10 C70,18 45,15 20,10 C-5,5 -20,-15 -30,-50 Z"
            fill="url(#goldGrad)" stroke="#5C3D00" stroke-width="1.5" />

      <!-- Lion Snout / Upper Jaw (Facing Right) -->
      <path d="M70,-38 C90,-30 115,-20 125,-12 C132,-5 130,10 115,18 C95,22 65,15 50,12 C40,5 50,-20 70,-38 Z"
            fill="url(#goldGrad)" stroke="#5C3D00" stroke-width="1.5" />

      <!-- Lion Crown (Athletic 3-Spike Royal Crown) -->
      <g transform="translate(15, -60) rotate(15)">
        <polygon points="-25,0 -18,-24 -8,-8 0,-30 8,-8 18,-24 25,0" fill="url(#goldGrad)" stroke="#4F3100" stroke-width="1.2" />
        <circle cx="-18" cy="-24" r="2.5" fill="#ED1B24" />
        <circle cx="0" cy="-30" r="3" fill="#ED1B24" />
        <circle cx="18" cy="-24" r="2.5" fill="#ED1B24" />
        <line x1="-24" y1="-2" x2="24" y2="-2" stroke="#4F3100" stroke-width="1.5" />
      </g>

      <!-- Fierce Eye & Brow -->
      <path d="M38,-20 L68,-14 L55,-8 Z" fill="#240003" />
      <polygon points="42,-18 64,-13 54,-9" fill="#FFFFFF" />
      <polygon points="50,-16 60,-13 54,-11" fill="#FFD700" />
      <circle cx="55" cy="-13" r="1.5" fill="#000000" />
      <!-- Brow crease -->
      <path d="M35,-24 C50,-26 65,-22 75,-16" stroke="#5C3D00" stroke-width="2" stroke-linecap="round" fill="none" />

      <!-- Nose Tip & Whisker Marks -->
      <polygon points="120,-14 128,-8 118,-2" fill="#240003" />
      <circle cx="100" cy="4" r="1.8" fill="#5C3D00" />
      <circle cx="90" cy="8" r="1.8" fill="#5C3D00" />
      <circle cx="105" cy="10" r="1.8" fill="#5C3D00" />

      <!-- Roaring Open Jaws (Dark Cavity, Tongue & Razor Fangs) -->
      <!-- Mouth cavity -->
      <path d="M55,14 L115,18 C115,25 95,45 80,50 L45,30 Z" fill="#1A0002" stroke="#5C3D00" stroke-width="1" />
      <!-- Tongue -->
      <path d="M60,35 C75,25 90,40 75,48 Z" fill="#C4121B" />
      <!-- Upper Razor Fangs -->
      <polygon points="106,18 98,34 92,18" fill="#FFFFFF" stroke="#8B7355" stroke-width="0.5" />
      <polygon points="88,17 83,28 78,17" fill="#FFFFFF" />
      <polygon points="74,16 70,24 66,16" fill="#FFFFFF" />

      <!-- Lower Jaw / Fangs (Facing Right) -->
      <path d="M40,32 L78,50 C88,52 95,46 92,58 C85,68 60,70 35,50 Z" fill="url(#goldGrad)" stroke="#5C3D00" stroke-width="1.5" />
      <!-- Lower Fangs -->
      <polygon points="88,48 82,34 78,49" fill="#FFFFFF" stroke="#8B7355" stroke-width="0.5" />
      <polygon points="74,47 70,38 66,48" fill="#FFFFFF" />

      <!-- Beard Tufts -->
      <polygon points="35,52 25,75 10,50" fill="url(#goldGrad)" stroke="#5C3D00" stroke-width="1" />
      <polygon points="20,55 8,85 -5,55" fill="url(#goldGrad)" stroke="#5C3D00" stroke-width="1" />
    </g>

    <!-- BANNER: "PUNJAB" -->
    <g transform="translate(0, 36)">
      <!-- Ribbon Tails -->
      <path d="M88,360 L150,348 L150,406 L88,418 L105,389 Z" fill="#290003" />
      <path d="M91,364 L147,353 L147,403 L91,414 L107,389 Z" fill="url(#goldGrad)" />
      <path d="M150,348 L170,348 L150,370 Z" fill="#0A0001" />

      <path d="M512,360 L450,348 L450,406 L512,418 L495,389 Z" fill="#290003" />
      <path d="M509,364 L453,353 L453,403 L509,414 L493,389 Z" fill="url(#goldGrad)" />
      <path d="M450,348 L430,348 L450,370 Z" fill="#0A0001" />

      <!-- Main Banner Plaque -->
      <path d="M135,345 L465,345 L482,410 L118,410 Z" fill="#120002" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropHeavy)" />
      <path d="M142,351 L458,351 L473,404 L127,404 Z" fill="#7A0007" stroke="#FFEAA0" stroke-width="1" />

      <!-- Accent Filigree Lines -->
      <line x1="148" y1="356" x2="452" y2="356" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />
      <line x1="135" y1="399" x2="465" y2="399" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />

      <!-- "PUNJAB" TEXT -->
      <text x="300" y="392"
            font-family="'Montserrat', 'Trebuchet MS', 'Arial Black', sans-serif"
            font-size="36"
            font-weight="900"
            font-style="italic"
            letter-spacing="6"
            text-anchor="middle"
            fill="url(#goldGrad)"
            stroke="#1A0002"
            stroke-width="2.2"
            filter="url(#dropSmall)">PUNJAB</text>
    </g>
  </g>
</svg>