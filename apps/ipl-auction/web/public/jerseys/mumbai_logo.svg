<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9D2" />
      <stop offset="20%" stop-color="#F5D76E" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#9E781B" />
      <stop offset="90%" stop-color="#E6C25A" />
      <stop offset="100%" stop-color="#FFF5B8" />
    </linearGradient>

    <linearGradient id="goldBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#785207" />
      <stop offset="50%" stop-color="#E2BE53" />
      <stop offset="100%" stop-color="#FFF9DB" />
    </linearGradient>

    <!-- Deep Royal Blue Field Gradients -->
    <linearGradient id="blueField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0060F0" />
      <stop offset="30%" stop-color="#0044B8" />
      <stop offset="70%" stop-color="#002875" />
      <stop offset="100%" stop-color="#001138" />
    </linearGradient>

    <radialGradient id="innerGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#00A2FF" stop-opacity="0.7" />
      <stop offset="45%" stop-color="#0055D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#001138" stop-opacity="0" />
    </radialGradient>

    <!-- Razor Flame Gradients -->
    <linearGradient id="flameGold" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFDF70" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C600B" />
    </linearGradient>

    <linearGradient id="flameCyan" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#A8F5FF" />
      <stop offset="35%" stop-color="#00C4FF" />
      <stop offset="75%" stop-color="#0066CC" />
      <stop offset="100%" stop-color="#002B66" />
    </linearGradient>

    <!-- Filters -->
    <filter id="crestShadow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000714" flood-opacity="0.75" />
    </filter>

    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000B1A" flood-opacity="0.7" />
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- 5 CHAMPIONSHIP STARS -->
    <g filter="url(#dropSmall)">
      <!-- 1 Far Left -->
      <path d="M178,74 L181.5,84 L192,84 L183.5,90.5 L186.5,101 L178,94.5 L169.5,101 L172.5,90.5 L164,84 L174.5,84 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="0.8" transform="rotate(-16, 178, 87)" />
      <!-- 2 Mid Left -->
      <path d="M235,54 L239,66 L251.5,66 L241.5,73.5 L245,85.5 L235,78 L225,85.5 L228.5,73.5 L218.5,66 L231,66 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="1" transform="rotate(-8, 235, 70)" />
      <!-- 3 Center Star (Grand Championship Star) -->
      <path d="M300,36 L305,51 L321,51 L308,61 L313,76 L300,66.5 L287,76 L292,61 L279,51 L295,51 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="1.4" />
      <!-- 4 Mid Right -->
      <path d="M365,54 L369,66 L381.5,66 L371.5,73.5 L375,85.5 L365,78 L355,85.5 L358.5,73.5 L348.5,66 L361,66 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="1" transform="rotate(8, 365, 70)" />
      <!-- 5 Far Right -->
      <path d="M422,74 L425.5,84 L436,84 L427.5,90.5 L430.5,101 L422,94.5 L413.5,101 L416.5,90.5 L408,84 L418.5,84 Z" fill="url(#goldGrad)" stroke="#694300" stroke-width="0.8" transform="rotate(16, 422, 87)" />
    </g>

    <!-- SHIELD FOUNDATION -->
    <g filter="url(#crestShadow)">
      <!-- Outer Heavy Gold Shield Rim -->
      <path d="M300,92 L468,122 C486,230 476,366 300,488 C124,366 114,230 132,122 Z"
            fill="url(#goldGrad)" stroke="#573600" stroke-width="2" />

      <!-- Recessed Obsidian Inset -->
      <path d="M300,101 L458,129 C474,232 465,358 300,474 C135,358 126,232 142,129 Z"
            fill="#000B1A" stroke="#FFE885" stroke-width="1" />

      <!-- Royal Blue Field -->
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#blueField)" />

      <!-- Dynamic Radial Energy Glow -->
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#innerGlow)" />

      <!-- Geometric Pinstripe Shield Accent -->
      <path d="M300,122 L434,146 C446,236 438,338 300,442 C162,338 154,236 166,146 Z"
            fill="none" stroke="url(#goldBevel)" stroke-width="1.8" opacity="0.6" stroke-dasharray="14 6" />
    </g>

    <!-- CENTERPIECE: SHARP DYNAMIC CYCLONE VORTEX & CRICKET CREST -->
    <g transform="translate(300, 260)">
      <!-- Concentric Speed Rings -->
      <circle cx="0" cy="0" r="96" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.35" stroke-dasharray="24 12 6 12" />
      <circle cx="0" cy="0" r="82" fill="none" stroke="#00C4FF" stroke-width="1" opacity="0.4" />

      <!-- 6 DYNAMIC SHARP RAZOR FLAME BLADES (6-Fold Spiraling Vortex) -->
      <!-- Blade 1 (0 deg - Top) -->
      <g transform="rotate(0)">
        <path d="M0,-20 C22,-78 68,-88 88,-70 C72,-42 42,-34 26,-22 C14,-14 6,-16 0,-20 Z" fill="url(#flameGold)" filter="url(#dropSmall)" />
        <path d="M2,-24 C20,-68 54,-76 72,-62 C58,-42 34,-36 22,-26 Z" fill="#FFFFFF" opacity="0.75" />
      </g>
      <!-- Blade 2 (60 deg - Top Right) -->
      <g transform="rotate(60)">
        <path d="M0,-20 C22,-78 68,-88 88,-70 C72,-42 42,-34 26,-22 C14,-14 6,-16 0,-20 Z" fill="url(#flameCyan)" filter="url(#dropSmall)" />
        <path d="M2,-24 C20,-68 54,-76 72,-62 C58,-42 34,-36 22,-26 Z" fill="#E0FAFF" opacity="0.75" />
      </g>
      <!-- Blade 3 (120 deg - Bottom Right) -->
      <g transform="rotate(120)">
        <path d="M0,-20 C22,-78 68,-88 88,-70 C72,-42 42,-34 26,-22 C14,-14 6,-16 0,-20 Z" fill="url(#flameGold)" filter="url(#dropSmall)" />
        <path d="M2,-24 C20,-68 54,-76 72,-62 C58,-42 34,-36 22,-26 Z" fill="#FFFFFF" opacity="0.75" />
      </g>
      <!-- Blade 4 (180 deg - Bottom) -->
      <g transform="rotate(180)">
        <path d="M0,-20 C22,-78 68,-88 88,-70 C72,-42 42,-34 26,-22 C14,-14 6,-16 0,-20 Z" fill="url(#flameCyan)" filter="url(#dropSmall)" />
        <path d="M2,-24 C20,-68 54,-76 72,-62 C58,-42 34,-36 22,-26 Z" fill="#E0FAFF" opacity="0.75" />
      </g>
      <!-- Blade 5 (240 deg - Bottom Left) -->
      <g transform="rotate(240)">
        <path d="M0,-20 C22,-78 68,-88 88,-70 C72,-42 42,-34 26,-22 C14,-14 6,-16 0,-20 Z" fill="url(#flameGold)" filter="url(#dropSmall)" />
        <path d="M2,-24 C20,-68 54,-76 72,-62 C58,-42 34,-36 22,-26 Z" fill="#FFFFFF" opacity="0.75" />
      </g>
      <!-- Blade 6 (300 deg - Top Left) -->
      <g transform="rotate(300)">
        <path d="M0,-20 C22,-78 68,-88 88,-70 C72,-42 42,-34 26,-22 C14,-14 6,-16 0,-20 Z" fill="url(#flameCyan)" filter="url(#dropSmall)" />
        <path d="M2,-24 C20,-68 54,-76 72,-62 C58,-42 34,-36 22,-26 Z" fill="#E0FAFF" opacity="0.75" />
      </g>

      <!-- Center Champion Medallion -->
      <circle cx="0" cy="0" r="26" fill="url(#goldGrad)" stroke="#4F3100" stroke-width="2" />
      <circle cx="0" cy="0" r="20" fill="#001C52" stroke="#FFE885" stroke-width="1.2" />
      <!-- Stylized Monogram M in Central Core -->
      <path d="M-11,10 L-11,-9 L-2,3 L0,3 L9,-9 L9,10 L5,10 L5,-2 L-0.5,6 L-1.5,6 L-7,-2 L-7,10 Z" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="0.5" />
    </g>

    <!-- BANNER: "MUMBAI" (Beveled Heavy Athletic Championship Ribbon) -->
    <g transform="translate(0, 38)">
      <!-- Ribbon Left Swallowtail -->
      <path d="M95,360 L155,348 L155,406 L95,418 L112,389 Z" fill="#5E3C02" />
      <path d="M98,364 L152,353 L152,403 L98,414 L114,389 Z" fill="url(#goldBevel)" />
      <path d="M155,348 L175,348 L155,370 Z" fill="#000B1A" />

      <!-- Ribbon Right Swallowtail -->
      <path d="M505,360 L445,348 L445,406 L505,418 L488,389 Z" fill="#5E3C02" />
      <path d="M502,364 L448,353 L448,403 L502,414 L486,389 Z" fill="url(#goldBevel)" />
      <path d="M445,348 L425,348 L445,370 Z" fill="#000B1A" />

      <!-- Banner Center Body Plate (Faceted 3D) -->
      <path d="M138,345 L462,345 L478,410 L122,410 Z" fill="#000E26" stroke="url(#goldGrad)" stroke-width="3" filter="url(#crestShadow)" />
      <path d="M145,351 L455,351 L469,404 L131,404 Z" fill="url(#blueField)" stroke="#FFEAA0" stroke-width="1" />

      <!-- Metallic Accent Ribs on Banner -->
      <line x1="150" y1="356" x2="450" y2="356" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />
      <line x1="138" y1="399" x2="462" y2="399" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />

      <!-- "MUMBAI" HIGH-IMPACT VARSITY LETTERING -->
      <text x="300" y="392"
            font-family="'Montserrat', 'Trebuchet MS', 'Arial Black', sans-serif"
            font-size="36"
            font-weight="900"
            font-style="italic"
            letter-spacing="6"
            text-anchor="middle"
            fill="url(#goldGrad)"
            stroke="#000A1A"
            stroke-width="2.2"
            filter="url(#dropSmall)">MUMBAI</text>
    </g>
  </g>
</svg>