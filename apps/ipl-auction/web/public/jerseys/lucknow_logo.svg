<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="20%" stop-color="#FCE070" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#997316" />
      <stop offset="100%" stop-color="#FFEA8A" />
    </linearGradient>

    <!-- Cobalt Blue Field -->
    <linearGradient id="blueField" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="40%" stop-color="#0047BA" />
      <stop offset="80%" stop-color="#002466" />
      <stop offset="100%" stop-color="#001133" />
    </linearGradient>

    <!-- Saffron & Green Wing Gradients -->
    <linearGradient id="saffronGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D4380D" />
      <stop offset="50%" stop-color="#FA541C" />
      <stop offset="100%" stop-color="#FF9C6E" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#237804" />
      <stop offset="50%" stop-color="#52C41A" />
      <stop offset="100%" stop-color="#95DE64" />
    </linearGradient>

    <radialGradient id="blueGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0088FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0047BA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#001133" stop-opacity="0" />
    </radialGradient>

    <filter id="dropHeavy" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="dropSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- SHIELD -->
    <g filter="url(#dropHeavy)">
      <path d="M300,92 L468,122 C486,230 476,366 300,488 C124,366 114,230 132,122 Z"
            fill="url(#goldGrad)" stroke="#4F3100" stroke-width="2" />
      <path d="M300,101 L458,129 C474,232 465,358 300,474 C135,358 126,232 142,129 Z"
            fill="#001133" stroke="#FFE885" stroke-width="1" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#blueField)" />
      <path d="M300,108 L450,135 C465,234 456,352 300,464 C144,352 135,234 150,135 Z"
            fill="url(#blueGlow)" />
      <path d="M300,122 L434,146 C446,236 438,338 300,442 C162,338 154,236 166,146 Z"
            fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.6" stroke-dasharray="14 6" />
    </g>

    <!-- CENTERPIECE: TRI-COLOR SPEED WINGS & CRICKET FALCON (Original Artwork) -->
    <g transform="translate(300, 255)" filter="url(#dropSmall)">
      <!-- Saffron Speed Feather (Top Left) -->
      <path d="M-12,30 C-35,15 -65,-10 -80,-55 C-60,-30 -35,-15 -20,5 Z" fill="url(#saffronGrad)" />
      <!-- White Speed Feather (Mid Left) -->
      <path d="M-16,40 C-45,25 -75,-2 -90,-35 C-70,-15 -45,0 -26,18 Z" fill="#FFFFFF" />
      <!-- Green Speed Feather (Low Left) -->
      <path d="M-18,50 C-45,40 -70,20 -82,-5 C-65,10 -40,25 -24,32 Z" fill="url(#greenGrad)" />

      <!-- Saffron Speed Feather (Top Right) -->
      <path d="M12,30 C35,15 65,-10 80,-55 C60,-30 35,-15 20,5 Z" fill="url(#saffronGrad)" />
      <!-- White Speed Feather (Mid Right) -->
      <path d="M16,40 C45,25 75,-2 90,-35 C70,-15 45,0 26,18 Z" fill="#FFFFFF" />
      <!-- Green Speed Feather (Low Right) -->
      <path d="M18,50 C45,40 70,20 82,-5 C65,10 40,25 24,32 Z" fill="url(#greenGrad)" />

      <!-- Center Falcon Body / Golden Cricket Bat Core -->
      <path d="M0,-35 L12,-10 L8,55 L0,78 L-8,55 L-12,-10 Z" fill="url(#goldGrad)" stroke="#4F3100" stroke-width="1.2" />

      <!-- Fierce Falcon Head Profile -->
      <path d="M0,-35 L8,-55 L18,-48 L28,-42 L12,-38 L5,-32 Z" fill="#FFFBE6" />
      <polygon points="18,-48 34,-45 22,-40" fill="url(#saffronGrad)" stroke="#401200" stroke-width="0.8" />
      <circle cx="10" cy="-45" r="2.5" fill="#000000" />
      <circle cx="10" cy="-45" r="1" fill="#FFEA00" />

      <!-- Crowned Golden Monogram 'L' Medallion -->
      <circle cx="0" cy="15" r="16" fill="#00184A" stroke="url(#goldGrad)" stroke-width="1.5" />
      <text x="0" y="22" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" fill="url(#goldGrad)" text-anchor="middle">L</text>
    </g>

    <!-- BANNER: "LUCKNOW" -->
    <g transform="translate(0, 38)">
      <path d="M85,360 L145,348 L145,406 L85,418 L102,389 Z" fill="#002466" />
      <path d="M88,364 L142,353 L142,403 L88,414 L104,389 Z" fill="url(#goldGrad)" />
      <path d="M145,348 L165,348 L145,370 Z" fill="#000B1A" />

      <path d="M515,360 L455,348 L455,406 L515,418 L498,389 Z" fill="#002466" />
      <path d="M512,364 L458,353 L458,403 L512,414 L496,389 Z" fill="url(#goldGrad)" />
      <path d="M455,348 L435,348 L455,370 Z" fill="#000B1A" />

      <path d="M130,345 L470,345 L488,410 L112,410 Z" fill="#001133" stroke="url(#goldGrad)" stroke-width="3" filter="url(#dropHeavy)" />
      <path d="M137,351 L463,351 L479,404 L121,404 Z" fill="#002B7A" stroke="#FFEAA0" stroke-width="1" />

      <line x1="142" y1="356" x2="458" y2="356" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />
      <line x1="128" y1="399" x2="472" y2="399" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.9" />

      <!-- "LUCKNOW" TEXT -->
      <text x="300" y="392"
            font-family="'Montserrat', 'Trebuchet MS', 'Arial Black', sans-serif"
            font-size="33"
            font-weight="900"
            font-style="italic"
            letter-spacing="5"
            text-anchor="middle"
            fill="url(#goldGrad)"
            stroke="#000B1A"
            stroke-width="2"
            filter="url(#dropSmall)">LUCKNOW</text>
    </g>
  </g>
</svg>